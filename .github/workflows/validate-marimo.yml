name: Validate marimo teaching backend
on:
  push:
    branches: [feature/marimo-teaching-backend]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  marimo-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install "marimo>=0.15" numpy
      - name: Python syntax compilation
        run: python -m compileall -q llm-analysis-to-raw-notebooks/scripts llm-analysis-to-raw-notebooks/assets
      - name: Validate native marimo templates
        run: |
          python llm-analysis-to-raw-notebooks/scripts/check_marimo.py llm-analysis-to-raw-notebooks/assets/marimo-lesson-template.py llm-analysis-to-raw-notebooks/assets/marimo-processing-stage-template.py --json
          python -m marimo check llm-analysis-to-raw-notebooks/assets/marimo-lesson-template.py
          python -m marimo check llm-analysis-to-raw-notebooks/assets/marimo-processing-stage-template.py
      - name: Run templates headlessly
        run: |
          mkdir -p /tmp/lesson-test-data /tmp/lesson-test-output
          python llm-analysis-to-raw-notebooks/scripts/run_marimo.py llm-analysis-to-raw-notebooks/assets/marimo-lesson-template.py --data-root /tmp/lesson-test-data --output-root /tmp/lesson-test-output
          python llm-analysis-to-raw-notebooks/scripts/run_marimo.py llm-analysis-to-raw-notebooks/assets/marimo-processing-stage-template.py --data-root /tmp/lesson-test-data --output-root /tmp/lesson-test-output
          python - <<'PY'
          import json, pathlib
          for report in pathlib.Path('/tmp/lesson-test-output/executed').glob('*.validation.json'):
              r = json.loads(report.read_text())
              assert r['headless_succeeded'] and not r['interactive_controls_tested']
              assert not r['scientific_comparison_verified']
              print(report.name, 'OK')
          PY
      - name: Verify deterministic numerical execution with a synthetic fixture
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tempfile, json
          root = pathlib.Path(tempfile.mkdtemp())
          data = root / 'data'
          out = root / 'out'
          data.mkdir()
          (data / 'trials.csv').write_text('reward,effort,accept\\n1,1,1\\n2,1,1\\n1,3,0\\n2,3,0\\n')
          notebook = root / 'fixture.py'
          notebook.write_text("""import marimo
app = marimo.App()
@app.cell
def _():
    from pathlib import Path
    import os
    import csv
    import marimo as mo
    return Path, os, csv, mo
@app.cell
def _(Path, os):
    DATA_ROOT = Path(os.environ['DATA_ROOT'])
    OUTPUT_ROOT = Path(os.environ['OUTPUT_ROOT'])
    return DATA_ROOT, OUTPUT_ROOT
@app.cell
def _(DATA_ROOT, OUTPUT_ROOT, csv, mo):
    with (DATA_ROOT / 'trials.csv').open() as file:
        rows = list(csv.DictReader(file))
    observed = sum(int(r['accept']) for r in rows) / len(rows)
    source = 0.5
    tolerance = 1e-12
    assert abs(observed - source) <= tolerance
    OUTPUT_ROOT.mkdir(exist_ok=True, parents=True)
    (OUTPUT_ROOT / 'comparison.json').write_text(
        __import__('json').dumps({'source': source, 'computed': observed, 'match': True}))
    mo.md(f"Synthetic fixture comparison passed: {observed}")
    return
if __name__ == '__main__':
    app.run()
""")
          p = subprocess.run([sys.executable, 'llm-analysis-to-raw-notebooks/scripts/run_marimo.py', str(notebook),
               '--data-root', str(data), '--output-root', str(out)], text=True, capture_output=True)
          print(p.stdout, p.stderr)
          assert p.returncode == 0, 'fixture execution failed'
          result = json.loads((out / 'comparison.json').read_text())
          assert result['source'] == result['computed'] == .5 and result['match']
          assert (out / 'executed' / 'fixture.html').exists()
          print('Independent numerical fixture comparison succeeded')
          PY
      - name: Test failure paths
        run: |
          python - <<'PY'
          import subprocess, sys, tempfile, pathlib
          root=pathlib.Path(tempfile.mkdtemp())
          file=root/'invalid.py'
          file.write_text('import marimo\napp = marimo.App()\n@app.cell\ndef _():\n    x = 1\n    x = 2\n')
          p=subprocess.run([sys.executable,'llm-analysis-to-raw-notebooks/scripts/check_marimo.py',str(file)],capture_output=True,text=True)
          print('static check rc',p.returncode,p.stdout,p.stderr)
          assert p.returncode != 0
          PY
